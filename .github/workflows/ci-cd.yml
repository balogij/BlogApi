name: C# Web API & MySQL CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# GHCR (GitHub Container Registry) írási jogok megadása a GITHUB_TOKEN-nek
permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Háttérben futó MySQL adatbázis konténer az integrációs tesztekhez
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: blog
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # 1. Kód letöltése a repóból
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. .NET 10 SDK beállítása
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. Adatbázis inicializálása a gyökérben lévő blog.sql fájlból
    - name: Initialize MySQL Database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u testuser -ptestpassword blog < blog.sql

    # 4. C# függőségek letöltése és projekt buildelése
    - name: Restore dependencies
      run: dotnet restore BlogApi/BlogApi.csproj

    - name: Build project
      run: dotnet build BlogApi/BlogApi.csproj --no-restore --configuration Release

    # 5. Integrációs tesztek futtatása a MySQL adatbázison
    - name: Run Integration Tests
      env:
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=testdb;Uid=testuser;Pwd=testpassword;"
      run: dotnet test --no-build --configuration Release --verbosity normal

    # 6. Docker Buildx beállítása
    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-buildx-action@v3

    # 7. Bejelentkezés a GHCR-be
    - name: Log in to GitHub Container Registry (GHCR)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 8. Docker Image elkészítése és feltöltése
    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/balogij/webapi-app:latest
          ghcr.io/balogij/webapi-app:${{ github.sha }}

  # ÚJ JOB: Környezet definiálása és telepítés/ellenőrzés
  deploy:
    name: Deploy to Production
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    environment:
      name: dev_env
      url: https://github.com/balogij?tab=packages

    steps:
    - name: Deployment status check
      run: |
        echo "A Docker image sikeresen elkészült és frissült a GHCR-ben."
        echo "Telepítési környezet: dev_env"
