name: C# Web API & MySQL CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    # Háttérben futó szolgáltatások (MySQL Adatbázis a tesztekhez)
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        # Megvárjuk, amíg a MySQL teljesen elindul
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # 1. Kód letöltése
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. .NET 8 SDK beállítása
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # 3. C# függőségek letöltése
    - name: Restore dependencies
      run: dotnet restore

    # SQL script futtatása a GitHub Actions MySQL service konténeren
    - name: Initialize Database Schema
      run: |
        mysql -h 127.0.0.1 -P 3306 -u testuser -ptestpassword testdb < ../blog.sql

    # 4. Projekt buildelése
    - name: Build project
      run: dotnet build --no-restore --configuration Release

    # 5. Tesztek futtatása a MySQL adatbázison
    - name: Run Integration Tests
      env:
        # A C# API ConnectionString felülírása a CI környezet adataival
        ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=testdb;Uid=testuser;Pwd=testpassword;"
      run: dotnet test --no-build --configuration Release --verbosity normal

    # 6. Docker Image készítése (Docker Hub vagy GHCR fiók szükséges hozzá)
    # Ez a lépés csak a main ágra történő push esetén fut le
    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry (GHCR)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/webapi-app:latest
          ghcr.io/${{ github.repository_owner }}/webapi-app:${{ github.sha }}
